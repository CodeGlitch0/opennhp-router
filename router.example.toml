# Operator settings. Nothing else is required.
# Keys and peer addresses are generated. Do not paste them here.
# public_host must be an address on this host, or a name that resolves to one.
# backend_host must be reachable from the host, not a compose service name.

window_seconds = 60

[[identities]]
pubkey = "replace-with-client-public-key"

[[resources]]
name = "app"

[[resources.forwards]]
public_host = "gateway.example"
public_port = 443
backend_host = "10.0.0.10"
backend_port = 8080
protocol = "tcp"
