# Default stack: NHP-AC (gateway), NHP-Server, and the auth service.
# Host network: compose DNS names do not resolve. Peers dial 127.0.0.1.
# Relay is optional. A no-relay start does not wait for it.
# The agent is not part of this file.

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gateway
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - gateway_keys:/var/lib/opennhp/gateway
      - gateway_pub:/run/publish/gateway
      - server_pub:/run/peers/server:ro
      - ../router.toml:/etc/opennhp/router.toml:ro
    depends_on:
      - server
      - auth

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server
    network_mode: host
    environment:
      OPENNHP_REQUIRE_RELAY: ${OPENNHP_REQUIRE_RELAY:-}
    volumes:
      - server_keys:/var/lib/opennhp/server
      - server_pub:/run/publish/server
      - gateway_pub:/run/peers/gateway:ro
      - relay_pub:/run/peers/relay:ro
      - ../router.toml:/etc/opennhp/router.toml:ro
    depends_on:
      - auth

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: auth
    network_mode: host
    volumes:
      - auth_keys:/var/lib/opennhp/auth
      - ../router.toml:/etc/opennhp/router.toml:ro

  relay:
    profiles:
      - relay
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: relay
    network_mode: host
    volumes:
      - relay_keys:/var/lib/opennhp/relay
      - relay_pub:/run/publish/relay
      - server_pub:/run/peers/server:ro
    depends_on:
      - server

volumes:
  gateway_keys:
  server_keys:
  auth_keys:
  relay_keys:
  gateway_pub:
  server_pub:
  relay_pub:
